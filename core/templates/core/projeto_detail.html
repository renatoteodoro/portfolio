{% extends 'core/base.html' %}

{% block title %}{{ projeto.titulo }} — Renato Teodoro{% endblock %}

{% block content %}
<section class="min-h-screen pt-24 pb-16">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <a href="{% url 'index' %}#projetos"
           class="inline-flex items-center space-x-2 text-slate-400 hover:text-blue-400 transition-colors mb-8 group">
            <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
            <span>Voltar aos projetos</span>
        </a>

        <div class="bg-slate-800/60 rounded-2xl p-8 border border-slate-700/50">
            <h1 class="text-3xl font-bold text-white mb-4">{{ projeto.titulo }}</h1>
            <p class="text-slate-400 leading-relaxed">{{ projeto.descricao }}</p>

            <div class="flex flex-wrap gap-2 mt-6">
                {% for tech in projeto.stack %}
                <span class="px-3 py-1 bg-blue-950/60 border border-blue-800/40 text-blue-300 text-sm rounded-full font-medium">
                    {{ tech }}
                </span>
                {% endfor %}
            </div>

            <div class="flex space-x-4 mt-8 pt-6 border-t border-slate-700">
                <a href="{{ projeto.github_url }}" target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center space-x-2 bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg transition-colors text-sm font-medium">
                    <i class="fab fa-github"></i>
                    <span>Ver no GitHub</span>
                </a>
                <a href="{{ projeto.demo_url }}" target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center space-x-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg transition-colors text-sm font-medium">
                    <i class="fas fa-external-link-alt"></i>
                    <span>Ver Demo</span>
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
